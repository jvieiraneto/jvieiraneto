name: Generate README

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - 'fonts/**'
      - 'scripts/postbuild.mjs'
      - '.github/workflows/readme-aura.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fonts_dir: fonts
          auto_commit: 'false'

      # alt text nas imagens + correção de clip-path nos <svg> aninhados
      - name: Post-process
        run: node scripts/postbuild.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "regenerate README via readme-aura"
            git push
          fi
